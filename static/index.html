<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle Desk</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#273040; --text:#e6edf3; --muted:#8b949e;
    --eagle:#6ea8fe; --hawk:#3fb950; --owl:#d29922; --user:#a371f7; --sys:#6e7681;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;
       background:var(--bg);color:var(--text);height:100vh;display:flex}
  /* roster */
  aside{width:230px;background:var(--panel);border-right:1px solid var(--line);
        padding:18px 16px;flex-shrink:0}
  aside h1{font-size:16px;margin:0 0 4px}
  aside .mode{font-size:11px;color:var(--muted);margin-bottom:18px}
  .agent{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;
         margin-bottom:8px;background:#0d1117;border:1px solid var(--line)}
  .dot{width:10px;height:10px;border-radius:50%}
  .agent b{font-size:13px}
  .agent small{display:block;color:var(--muted);font-size:11px}
  /* main */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  #feed{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:10px;max-width:760px}
  .row .av{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:grid;
           place-items:center;font-size:12px;font-weight:700;color:#0d1117}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:12px;
          padding:10px 13px;font-size:14px;line-height:1.5}
  .who{font-size:11px;color:var(--muted);margin-bottom:3px}
  .handoff .bubble{background:transparent;border-style:dashed;color:var(--muted);
                   font-size:13px;font-style:italic}
  .sys{align-self:center;color:var(--sys);font-size:12px}
  .user{align-self:flex-end;flex-direction:row-reverse}
  .user .bubble{background:#1c2333;border-color:#2b3a5e}
  /* composer */
  form{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line);
       background:var(--panel)}
  input{flex:1;background:#0d1117;border:1px solid var(--line);border-radius:10px;
        color:var(--text);padding:12px 14px;font-size:14px;outline:none}
  button{background:var(--eagle);color:#0d1117;border:0;border-radius:10px;
         padding:0 20px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
  <aside>
    <h1>Eagle Desk</h1>
    <div class="mode" id="mode">...</div>
    <div class="agent"><span class="dot" style="background:var(--eagle)"></span>
      <div><b>Eagle</b><small>หัวหน้า / orchestrator</small></div></div>
    <div class="agent"><span class="dot" style="background:var(--hawk)"></span>
      <div><b>Hawk</b><small>infrastructure</small></div></div>
    <div class="agent"><span class="dot" style="background:var(--owl)"></span>
      <div><b>Owl</b><small>mail / calendar / tasks</small></div></div>
  </aside>
  <main>
    <div id="feed"></div>
    <form id="composer">
      <input id="box" placeholder="สั่งงาน Eagle... เช่น สรุป infra + เมลวันนี้" autocomplete="off">
      <button id="send">ส่ง</button>
    </form>
  </main>

<script>
const feed = document.getElementById('feed');
const box = document.getElementById('box');
const sendBtn = document.getElementById('send');
const COLOR = {eagle:'var(--eagle)',hawk:'var(--hawk)',owl:'var(--owl)',user:'var(--user)'};
const NAME  = {eagle:'Eagle',hawk:'Hawk',owl:'Owl',user:'คุณ'};

fetch('/api/status').then(r=>r.json()).then(s=>{
  document.getElementById('mode').textContent =
    s.mode === 'real' ? 'โหมด: เชื่อม Managed Agents จริง' : 'โหมด: MOCK (ยังไม่ต่อ API)';
});

function add(ev){
  if(ev.kind === 'done'){ sendBtn.disabled = false; box.focus(); return; }
  if(ev.lane === 'system'){
    const d = document.createElement('div'); d.className='sys'; d.textContent=ev.text; 
    feed.appendChild(d); feed.scrollTop=feed.scrollHeight; return;
  }
  const row = document.createElement('div');
  row.className = 'row ' + (ev.lane==='user'?'user':'') + (ev.kind==='handoff'?' handoff':'');
  const col = COLOR[ev.lane] || 'var(--sys)';
  row.innerHTML =
    (ev.lane!=='user' ? `<div class="av" style="background:${col}">${(NAME[ev.lane]||'?')[0]}</div>`:'')
    + `<div><div class="who">${NAME[ev.lane]||ev.lane}</div>`
    + `<div class="bubble"></div></div>`;
  row.querySelector('.bubble').textContent = ev.text;
  feed.appendChild(row); feed.scrollTop = feed.scrollHeight;
}

async function send(text){
  sendBtn.disabled = true;
  const res = await fetch('/api/message', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text})
  });
  const reader = res.body.getReader(); const dec = new TextDecoder(); let buf='';
  while(true){
    const {value, done} = await reader.read(); if(done) break;
    buf += dec.decode(value, {stream:true});
    let i;
    while((i = buf.indexOf('\n\n')) >= 0){
      const line = buf.slice(0, i).trim(); buf = buf.slice(i+2);
      if(line.startsWith('data:')){ try{ add(JSON.parse(line.slice(5).trim())); }catch(e){} }
    }
  }
  sendBtn.disabled = false;
}

document.getElementById('composer').addEventListener('submit', e=>{
  e.preventDefault();
  const t = box.value.trim(); if(!t) return;
  box.value=''; send(t);
});
</script>
</body>
</html>
